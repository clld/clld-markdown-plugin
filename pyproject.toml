[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clld-markdown-plugin"
version = "1.1.0"
description = "A clld plugin to render CLDF markdown in clld apps."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Robert Forkel", email = "dlce.rdm@eva.mpg.de"}
]
keywords = ["web", "pyramid", "clld"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "clld>=7.0",
    "clldutils",
    "pycldf",
    "markdown",
]

[project.urls]
Homepage = "https://github.com/clld/clld-markdown-plugin"

[project.optional-dependencies]
dev = [
    "ruff",
    "wheel",
    "build",
    "twine",
]
test = [
    "pytest>=5",
    "pytest-mock",
    "pytest-cov",
    "coverage>=4.2",
    "webtest",
]

[tool.setuptools]
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
exclude = [".tox"]

[tool.ruff.lint]
# E/F match default Flake8; D enables pydocstyle checks (since you ignored specific D rules)
select = ["UP", "N", "C90", "PL", "E", "F", "D"]
ignore = [
    "D211",
    "D213",
]

[tool.pytest.ini_options]
minversion = "5.0"
testpaths = ["tests"]
addopts = ["--cov"]

[tool.coverage.run]
source = [
    "clld_markdown_plugin",
    "tests",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.tox]
requires = ["tox>=4.19"]
env_list = ["py311", "py312", "py313", "py314", "py315"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
extras = ["test"]
commands = [["pytest", { replace = "posargs", default = [], extend = true }]]
